function MenuItem({ weight, name, desc, allergens, price, dark = false, compact = false }) {

    <div className="menu-item" style={{
      display: 'grid',
      gridTemplateColumns: compact ? '1fr auto' : '64px 1fr auto',
      gap: compact ? 16 : 24,
      alignItems: 'baseline',
      padding: compact ? '14px 16px' : '22px 16px',
      borderBottom: dark
        ? '1px solid rgba(200,150,12,0.18)'
        : '1px solid rgba(15,44,31,0.1)',
    }}>
      {!compact && (
        <div className="cg" style={{
          fontSize: 22, fontStyle: 'italic', fontWeight: 500,
          color: 'var(--gold)', letterSpacing: '0.02em', whiteSpace: 'nowrap',
        }}>
          {weight || ''}
        </div>
      )}

      <div>
        <div className="cg" style={{
          fontSize: compact ? 20 : 24, fontWeight: 600,
          color: dark ? 'var(--text-dark)' : 'var(--wood)',
          lineHeight: 1.2, letterSpacing: '0.005em',
        }}>
          {name}
        </div>
        {desc && (
          <div style={{
            fontFamily: 'Lato', fontSize: 16, fontWeight: 300,
            color: dark ? 'var(--text-mid)' : 'var(--mid)',
            marginTop: 4, lineHeight: 1.6,
          }}>
            {desc}
          </div>
        )}
        {allergens && (
          <div style={{
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.1em', textTransform: 'uppercase',
            color: 'var(--gold)', opacity: 0.65, marginTop: 5,

            Alergeny: {allergens}

        )}

      <div className="cg" style={{
        fontSize: compact ? 22 : 26, fontWeight: 700, fontStyle: 'italic',
        color: 'var(--gold)', letterSpacing: '0.01em',
        whiteSpace: 'nowrap', lineHeight: 1,
      }}>
        {price}<span style={{ fontSize: compact ? 14 : 18, marginLeft: 2, fontStyle: 'normal' }}>&nbsp;Kč</span>
      </div>
    </div>
  );
}

    <section id={section.id} className={cls} style={{
      background: bg,
      padding: dark ? '80px 64px' : '72px 64px',
      borderTop: dark ? '1px solid var(--gold)' : '1px solid rgba(15,44,31,0.08)',
      borderBottom: dark ? '1px solid var(--gold)' : 'none',
    }}>

          display: 'flex', alignItems: 'flex-start', gap: 24,

            : '1px solid rgba(200,150,12,0.4)',

            width: 52, height: 52,
            border: '1px solid var(--gold)',
            background: dark ? 'rgba(200,150,12,0.12)' : 'rgba(200,150,12,0.06)',
            color: 'var(--gold)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexShrink: 0,
          }}>
            <Icon name={section.icon} size={22} stroke={1.5} />
          </div>

          <div style={{ flex: 1 }}>
            <h2 className="cg" style={{
              fontSize: 'clamp(36px, 4vw, 48px)',
              fontWeight: 500, fontStyle: 'italic',
              color: dark ? 'var(--text-dark)' : 'var(--wood)',
              lineHeight: 1, marginBottom: 6,
            }}>
              {section.title}
            </h2>
            <div style={{
              fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
              letterSpacing: '0.24em', textTransform: 'uppercase',
              color: 'var(--gold)',
            }}>
              {section.sub}
            </div>
          </div>
        </div>

        {/* Items */}
        <div style={compact ? {
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))',
          gap: '0 48px',
        } : {}}>
          {section.items.map((item, i) => (
            <MenuItem key={i} {...item} dark={dark} compact={compact} />
          ))}
        </div>

        {/* Burger add-ons */}
        {section.addons && (
          <div style={{ marginTop: 32 }}>
            <div style={{
              fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
              letterSpacing: '0.22em', textTransform: 'uppercase',
              color: 'var(--mid)', marginBottom: 12, paddingLeft: 16,
            }}>
              Příplatky k burgerům
            </div>
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))',
              gap: '0 48px',
            }}>
              {section.addons.map((item, i) => (
                <MenuItem key={i} {...item} compact={true} />
              ))}
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

/* ─────────────────────────────────────────
   APP
   ───────────────────────────────────────── */
function App() {
  return (
    <>
      <SiteNav activePage="Stálé menu" />
      <div style={{ height: 72 }} />
      <MenuHero />
      {SECTIONS.map((s, i) => (
        <MenuSection key={s.id} section={s} idx={i} />
      ))}
      <SiteFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
