<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pivní lístek — Balounova Restaurace U Břízy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Lato:wght@400;700&subset=latin,latin-ext&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="nav.js"></script>
<script type="text/babel" src="footer.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ─────────────────────────────────────────
   SECTIONS DATA
   ───────────────────────────────────────── */
const SECTIONS = [
  {
    id: 'cepovana', title: 'Čepovaná piva', sub: 'Draft beer · 0,5 l / 0,3 l', icon: 'beer',
    note: 'Ceny za 0,5 l / 0,3 l. Šnyt: 0,4 l.',
    items: [
      { degree: '12°', name: 'Plzeňský Prazdroj z tanku', desc: 'ležák', price: [68, 46] },
      { degree: '12°', name: 'Plzeňský Prazdroj šnyt', desc: 'ležák · 0,4 l', price: 47 },
      { degree: '11°', name: 'Velkopopovický Kozel', price: [51, 36] },
      { degree: '10°', name: 'Velkopopovický Kozel černý', price: [51, 36] },
      { degree: '12°', name: 'Plzeňský Prazdroj řezaný', price: [68, 46] },
      { name: 'Birell', nonalcoholic: true, price: [51, 37] },
      { name: 'Birell pomelo', nonalcoholic: true, price: [51, 37] },
    ],
  },
];

/* ─────────────────────────────────────────
   ICONS
   ───────────────────────────────────────── */
const ICONS = {
  arrowL: <polyline points="15 18 9 12 15 6" />,
  bolt:   <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" />,
  phone:  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />,
  print:  <><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" /></>,
  beer:   <><path d="M5 3h11l-2 16H7L5 3z"/><path d="M16 7h3a2 2 0 0 1 0 6h-3"/><line x1="5" y1="10" x2="16" y2="10"/></>,
};

function Icon({ name, size = 18, stroke = 1.6, ...rest }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" {...rest}>
      {ICONS[name]}
    </svg>
  );
}

/* ─────────────────────────────────────────
   HERO
   ───────────────────────────────────────── */
function MenuHero() {
  const mob = useMobile();
  return (
    <section className="paper" style={{
      position: 'relative',
      padding: mob ? '88px 20px 48px' : '72px 64px 88px',
      borderBottom: '1px solid rgba(15,44,31,0.1)',
      overflow: 'hidden',
    }}>
      {!mob && (
        <div className="cg" aria-hidden="true" style={{
          position: 'absolute', right: -40, top: 8,
          fontSize: 220, fontStyle: 'italic', fontWeight: 500,
          color: 'rgba(200,150,12,0.07)',
          letterSpacing: '-0.04em', lineHeight: 1,
          pointerEvents: 'none', userSelect: 'none',
        }}>Pivo</div>
      )}

      <div style={{ maxWidth: 1240, margin: '0 auto', position: 'relative' }}>
        <nav style={{
          display: 'flex', alignItems: 'center', gap: 10,
          fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
          letterSpacing: '0.18em', textTransform: 'uppercase',
          color: 'var(--mid)', marginBottom: 28,
        }}>
          <a href="/" style={{ color: 'var(--mid)', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <Icon name="arrowL" size={12} />Zpět na úvod
          </a>
          <span style={{ opacity: 0.4 }}>/</span>
          <span style={{ color: 'var(--gold)' }}>Pivní lístek</span>
        </nav>

        <div style={{
          display: 'grid',
          gridTemplateColumns: mob ? '1fr' : '1fr auto',
          gap: 56,
          alignItems: 'end',
        }}>
          <div>
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: 12,
              fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
              letterSpacing: '0.24em', textTransform: 'uppercase',
              color: 'var(--gold)', marginBottom: 24,
            }}>
              <span style={{ width: 32, height: 1, background: 'var(--gold)' }} />
              Na čepu
            </div>
            <h1 className="cg" style={{
              fontSize: mob ? 'clamp(36px, 9vw, 56px)' : 'clamp(46px, 5.5vw, 82px)',
              fontWeight: 500, fontStyle: 'italic',
              color: 'var(--wood)', lineHeight: 0.95,
              letterSpacing: '-0.02em', marginBottom: 24,
              whiteSpace: mob ? 'normal' : 'nowrap',
            }}>
              Pivní lístek
            </h1>
          </div>

          {!mob && (
            <div style={{ textAlign: 'right', paddingBottom: 12 }}>
              <button onClick={() => window.print()} className="no-print" style={{
                display: 'inline-flex', alignItems: 'center', gap: 10,
                padding: '10px 18px',
                background: 'transparent',
                border: '1px solid rgba(15,44,31,0.2)',
                color: 'var(--wood)',
                fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
                letterSpacing: '0.18em', textTransform: 'uppercase',
                cursor: 'pointer', transition: 'all 0.2s',
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--gold)'; e.currentTarget.style.color = 'var(--gold)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(15,44,31,0.2)'; e.currentTarget.style.color = 'var(--wood)'; }}>
                <Icon name="print" size={14} stroke={1.8} />
                Tisk lístku
              </button>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

/* ─────────────────────────────────────────
   DELIVERY STRIP
   ───────────────────────────────────────── */
function DeliveryStrip() {
  const mob = useMobile();
  return (
    <div style={{
      background: 'var(--wood)',
      color: 'var(--text-dark)',
      padding: mob ? '24px 20px' : '28px 64px',
    }}>
      <div style={{
        maxWidth: 1240, margin: '0 auto',
        display: mob ? 'flex' : 'grid',
        flexDirection: mob ? 'column' : undefined,
        gridTemplateColumns: mob ? undefined : 'auto 1fr auto auto',
        alignItems: mob ? 'flex-start' : 'center',
        gap: mob ? 16 : 32,
      }}>
        {!mob && (
          <div style={{
            width: 52, height: 52,
            border: '1px solid var(--gold)',
            color: 'var(--gold)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name="bolt" size={22} stroke={1.6} />
          </div>
        )}

        <div>
          <div style={{
            fontFamily: 'Lato', fontSize: 10, fontWeight: 700,
            letterSpacing: '0.24em', textTransform: 'uppercase',
            color: 'var(--gold)', marginBottom: 4,
          }}>Rozvoz obědů a večeří</div>
          <div className="cg" style={{
            fontSize: mob ? 18 : 22, fontStyle: 'italic', fontWeight: 500,
            color: 'var(--text-dark)', letterSpacing: '0.01em',
          }}>
            Od 11:00 až k Vám domů nebo do práce
          </div>
        </div>

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <a href="tel:+420272766782" style={{
            display: 'inline-flex', alignItems: 'center', gap: 12,
            padding: '12px 20px',
            border: '1px solid rgba(200,150,12,0.4)',
            color: 'var(--text-dark)', textDecoration: 'none',
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.18em', textTransform: 'uppercase',
            transition: 'all 0.2s',
          }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--gold)'; e.currentTarget.style.color = 'var(--gold)'; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(200,150,12,0.4)'; e.currentTarget.style.color = 'var(--text-dark)'; }}>
            <Icon name="phone" size={14} stroke={1.8} />
            272 76 67 82
          </a>

          <a href="https://food.bolt.eu/en-US/271-prague/p/31855-restaurace-u-b%C5%99%C3%ADzy"
            target="_blank" rel="noopener" style={{
            display: 'inline-flex', alignItems: 'center', gap: 12,
            padding: '12px 22px',
            background: 'var(--gold)', color: 'var(--wood)',
            textDecoration: 'none',
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.18em', textTransform: 'uppercase',
            transition: 'background 0.2s',
          }}
          onMouseEnter={e => e.currentTarget.style.background = 'var(--gold-lt)'}
          onMouseLeave={e => e.currentTarget.style.background = 'var(--gold)'}>
            <Icon name="bolt" size={14} stroke={2} />
            Bolt Food
          </a>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   BEER ITEM
   ───────────────────────────────────────── */
function BeerItem({ degree, name, desc, nonalcoholic, price, dark = false }) {
  const mob = useMobile();
  const dual = Array.isArray(price);
  return (
    <div className="menu-item" style={{
      display: 'grid',
      gridTemplateColumns: mob ? '1fr auto' : '56px 1fr auto',
      gap: mob ? 12 : 24,
      alignItems: 'center',
      padding: mob ? '16px 0' : '22px 16px',
      borderBottom: dark
        ? '1px solid rgba(200,150,12,0.18)'
        : '1px solid rgba(15,44,31,0.1)',
    }}>
      {!mob && (
        <div className="cg" style={{
          fontSize: 22, fontStyle: 'italic', fontWeight: 700,
          color: 'var(--gold)', textAlign: 'center', lineHeight: 1,
        }}>
          {degree || ''}
        </div>
      )}

      <div>
        <div className="cg" style={{
          fontSize: mob ? 18 : 22, fontWeight: 600,
          color: dark ? 'var(--text-dark)' : 'var(--wood)',
          lineHeight: 1.2, letterSpacing: '0.005em',
        }}>
          {mob && degree ? `${degree} ${name}` : name}
        </div>
        {desc && (
          <div style={{
            fontFamily: 'Lato', fontSize: mob ? 12 : 13,
            color: dark ? 'var(--text-mid)' : 'var(--mid)',
            marginTop: 3,
          }}>
            {desc}
          </div>
        )}
        {nonalcoholic && (
          <div style={{
            display: 'inline-block', marginTop: 5,
            padding: '2px 9px',
            background: 'rgba(200,150,12,0.1)',
            border: '1px solid rgba(200,150,12,0.3)',
            fontFamily: 'Lato', fontSize: 10, fontWeight: 700,
            letterSpacing: '0.14em', textTransform: 'uppercase',
            color: 'var(--gold)',
          }}>
            nealkoholické
          </div>
        )}
      </div>

      <div className="cg" style={{
        fontSize: mob ? 18 : 24, fontWeight: 700, fontStyle: 'italic',
        color: 'var(--gold)', whiteSpace: 'nowrap', textAlign: 'right', lineHeight: 1,
      }}>
        {dual ? (
          <>
            {price[0]}
            <span style={{ fontSize: mob ? 12 : 15, fontStyle: 'normal', opacity: 0.45, margin: '0 5px' }}>/</span>
            {price[1]}
          </>
        ) : price}
        <span style={{ fontSize: mob ? 11 : 14, fontStyle: 'normal', marginLeft: 2 }}>&nbsp;Kč</span>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   BEER SECTION
   ───────────────────────────────────────── */
function BeerSection({ section, idx }) {
  const mob = useMobile();
  const dark = section.feature;
  const bg = dark ? 'var(--wood)' : (idx % 2 === 0 ? 'var(--cream)' : 'var(--sand)');
  const cls = dark ? '' : (idx % 2 === 0 ? 'paper' : 'paper-sand');
  return (
    <section id={section.id} className={cls} style={{
      background: bg,
      padding: mob ? '40px 16px' : (dark ? '80px 64px' : '72px 64px'),
      borderTop: dark ? '1px solid var(--gold)' : '1px solid rgba(15,44,31,0.08)',
      borderBottom: dark ? '1px solid var(--gold)' : 'none',
    }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div style={{
          display: 'flex', alignItems: 'flex-start', gap: 24,
          marginBottom: 36, paddingBottom: 20,
          borderBottom: dark
            ? '1px solid rgba(200,150,12,0.3)'
            : '1px solid rgba(200,150,12,0.4)',
        }}>
          <div style={{
            width: mob ? 40 : 52, height: mob ? 40 : 52,
            border: '1px solid var(--gold)',
            background: dark ? 'rgba(200,150,12,0.12)' : 'rgba(200,150,12,0.06)',
            color: 'var(--gold)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexShrink: 0,
          }}>
            <Icon name={section.icon} size={mob ? 18 : 22} stroke={1.5} />
          </div>

          <div style={{ flex: 1 }}>
            <h2 className="cg" style={{
              fontSize: mob ? 'clamp(26px, 7vw, 36px)' : 'clamp(36px, 4vw, 48px)',
              fontWeight: 500, fontStyle: 'italic',
              color: dark ? 'var(--text-dark)' : 'var(--wood)',
              lineHeight: 1, marginBottom: 6,
            }}>
              {section.title}
            </h2>
            <div style={{
              fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
              letterSpacing: '0.24em', textTransform: 'uppercase',
              color: 'var(--gold)',
            }}>
              {section.sub}
            </div>
          </div>

          {/* Price header — hidden on mobile */}
          {!mob && (
            <div style={{
              fontFamily: 'Lato', fontSize: 10, fontWeight: 700,
              letterSpacing: '0.2em', textTransform: 'uppercase',
              color: 'var(--mid)', textAlign: 'right',
              paddingTop: 6,
              whiteSpace: 'nowrap',
            }}>
              0,5 l &nbsp;/&nbsp; 0,3 l
            </div>
          )}
        </div>

        {section.items.map((item, i) => (
          <BeerItem key={i} {...item} dark={dark} />
        ))}

        {section.note && (
          <div style={{
            marginTop: 20,
            padding: '12px 16px',
            borderLeft: '2px solid rgba(200,150,12,0.5)',
            fontFamily: 'Lato', fontSize: 13, fontWeight: 400,
            color: dark ? 'var(--text-mid)' : 'var(--mid)',
            fontStyle: 'italic',
          }}>
            {section.note}
          </div>
        )}
      </div>
    </section>
  );
}

/* ─────────────────────────────────────────
   APP
   ───────────────────────────────────────── */
function App() {
  return (
    <>
      <SiteNav activePage="Pivní lístek" />
      <div style={{ height: 72 }} />
      <MenuHero />
      <DeliveryStrip />
      {SECTIONS.map((s, i) => (
        <BeerSection key={s.id} section={s} idx={i} />
      ))}
      <SiteFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
