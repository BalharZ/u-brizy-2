<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seznam alergenů — Balounova Restaurace U Břízy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Lato:wght@400;700&subset=latin,latin-ext&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="nav.js"></script>
<script type="text/babel" src="footer.js"></script>

<link rel="stylesheet" href="menu.css">

<body>
<div id="root"></div>

<script type="text/babel">

const ALLERGENS = [
  {
    n: 1,
    emoji: '🌾',
    name: 'Obiloviny obsahující lepek',
    desc: 'pšenice, žito, ječmen, oves, špalda, kamut nebo jejich hybridní odrůdy a výrobky z nich',
  },
  {
    n: 2,
    emoji: '🦐',
    name: 'Korýši',
    desc: 'a výrobky z nich',
  },
  {
    n: 3,
    emoji: '🥚',
    name: 'Vejce',
    desc: 'a výrobky z nich',
  },
  {
    n: 4,
    emoji: '🐟',
    name: 'Ryby',
    desc: 'a výrobky z nich',
  },
  {
    n: 5,
    emoji: '🥜',
    name: 'Podzemnice olejná (arašídy)',

  {

    name: 'Sójové boby (sója)',

  },
  {

  },
  {
    n: 13,
    emoji: '🌸',
    name: 'Vlčí bob (lupina)',
    desc: 'a výrobky z něj',
  },
  {
    n: 14,
    emoji: '🦪',
    name: 'Měkkýši',
    desc: 'a výrobky z nich',
  },
];

function AllergenCard({ a }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        display: 'flex',
        alignItems: 'flex-start',
        gap: 20,
        padding: '22px 26px',
        background: hovered ? 'rgba(200,150,12,0.05)' : 'rgba(255,255,255,0.55)',
        border: '1px solid rgba(92,112,100,0.15)',
        borderLeft: `3px solid ${hovered ? 'var(--gold)' : 'rgba(200,150,12,0.35)'}`,
        transition: 'all 0.2s',
      }}>
      <div style={{
        flexShrink: 0,
        width: 38, height: 38,
        borderRadius: '50%',
        background: 'var(--gold)',
        color: '#fff',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'Lato', fontWeight: 900, fontSize: 15,
        lineHeight: 1,
        marginTop: 2,
      }}>
        {a.n}
      </div>
      <div style={{
        flexShrink: 0,
        fontSize: 38,
        lineHeight: 1,
        marginTop: 0,
        userSelect: 'none',
      }}>
        {a.emoji}
      </div>
      <div style={{ flex: 1 }}>
        <div style={{
          fontFamily: 'Lato', fontWeight: 700,
          fontSize: 13, letterSpacing: '0.1em',
          textTransform: 'uppercase',
          color: 'var(--ink)',
          marginBottom: 5,
        }}>
          {a.name}
        </div>
        <div style={{
          fontFamily: 'Lato', fontWeight: 400,
          fontSize: 12.5, color: 'var(--mid)',
          lineHeight: 1.6,
        }}>
          {a.desc}
        </div>
      </div>
    </div>
  );
}

function App() {
  const mob = useMobile();
  return (
    <>
      <SiteNav activePage="Seznam alergenů" />

      {/* Hero */}
      <section className="paper" style={{
        position: 'relative',
        padding: mob ? '100px 20px 40px' : '148px 64px 72px',
        borderBottom: '1px solid rgba(15,44,31,0.1)',
        overflow: 'hidden',
      }}>
        {!mob && (
          <div className="cg" aria-hidden="true" style={{
            position: 'absolute', right: -24, top: 0,
            fontSize: 220, fontStyle: 'italic', fontWeight: 500,
            color: 'rgba(200,150,12,0.07)',
            letterSpacing: '-0.04em', lineHeight: 1,
            pointerEvents: 'none', userSelect: 'none',
          }}>Alergeny</div>
        )}

        <div style={{ maxWidth: 1240, margin: '0 auto', position: 'relative' }}>
          <nav style={{
            display: 'flex', alignItems: 'center', gap: 10,
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.18em', textTransform: 'uppercase',
            color: 'var(--mid)', marginBottom: 28,
          }}>
            <a href="/" style={{ color: 'var(--mid)', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
              <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
              Zpět na úvod
            </a>
            <span style={{ opacity: 0.4 }}>/</span>
            <span style={{ color: 'var(--gold)' }}>Seznam alergenů</span>
          </nav>

          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 12,
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.24em', textTransform: 'uppercase',
            color: 'var(--gold)', marginBottom: 20,
          }}>
            <span style={{ width: 32, height: 1, background: 'var(--gold)' }} />
            Informace
          </div>

          <h1 className="cg" style={{
            fontSize: mob ? 'clamp(36px, 9vw, 52px)' : 'clamp(42px, 5vw, 78px)',
            fontWeight: 500, fontStyle: 'italic',
            color: 'var(--wood)', lineHeight: 0.95,
            letterSpacing: '-0.02em', marginBottom: 0,
          }}>
            Seznam alergenů
          </h1>
        </div>
      </section>

      {/* EU Directive note */}
      <div style={{
        background: 'var(--sand)',
        borderBottom: '1px solid rgba(92,112,100,0.15)',
        padding: mob ? '12px 20px' : '14px 64px',
      }}>
        <div style={{ maxWidth: 1240, margin: '0 auto' }}>
          <span style={{
            fontFamily: 'Lato', fontSize: 11, fontWeight: 700,
            letterSpacing: '0.14em', textTransform: 'uppercase',
            color: 'var(--mid)',
          }}>
            Publikováno dle směrnice 2000/89 ES od 13. 12. 2014 · Nařízení 1169/2011 EU
          </span>

          {/* Info box */}

            display: 'flex', alignItems: 'flex-start', gap: 16,
            background: 'rgba(200,150,12,0.07)',
            border: '1px solid rgba(200,150,12,0.25)',
            borderLeft: '3px solid var(--gold)',
            padding: mob ? '14px 16px' : '18px 24px',
            marginBottom: mob ? 28 : 48,
          }}>
            <div style={{ flexShrink: 0, marginTop: 1, color: 'var(--gold)' }}>
              <svg width={20} height={20} viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="8" strokeWidth={2.5} />
                <line x1="12" y1="12" x2="12" y2="16" />
              </svg>
            </div>
            <p style={{ fontSize: mob ? 13 : 14, color: 'var(--mid)', lineHeight: 1.65, margin: 0 }}>

          </p>
        </div>
      </main>

      <SiteFooter />
    </>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
